name: Build APK and Web
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android + web projects (keeps our lib/pubspec/assets)
        run: |
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android,web --project-name qiraati --org com.qiraati .
          rm -rf lib pubspec.yaml && cp -r /tmp/keep/lib /tmp/keep/pubspec.yaml .
          rm -rf test analysis_options.yaml
      - name: Allow text-to-speech on Android 11+
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application|' $M
          grep -n "TTS_SERVICE" $M
      - run: flutter pub get
      - name: Static analysis (fails only on errors)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: qiraati-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build web (does not block the APK)
        continue-on-error: true
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Check web output
        id: web
        run: test -f build/web/index.html && echo "ok=true" >> $GITHUB_OUTPUT || echo "ok=false" >> $GITHUB_OUTPUT
      - if: steps.web.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qiraati-web
          path: build/web
      - if: steps.web.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
