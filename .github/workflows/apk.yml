name: Build APK

# يبني ملف APK ويضعه في Releases برابط ثابت للتحميل المباشر من الهاتف:
# https://github.com/<الحساب>/<المستودع>/releases/download/latest-apk/qiraati.apk
# تشغيل يدوي: Actions ← Build APK ← Run workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project (keeps our lib/pubspec/assets)
        run: |
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --project-name qiraati --org com.qiraati .
          rm -rf lib pubspec.yaml && cp -r /tmp/keep/lib /tmp/keep/pubspec.yaml .
          rm -rf test analysis_options.yaml

      - name: Allow internet and text-to-speech
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application|' $M
          grep -n "INTERNET" $M

      # توقيع ثابت: يسمح بتحديث التطبيق فوق النسخة المثبّتة بدل حذفها
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk qiraati.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk qiraati.apk \
            --title "قراءتي - APK" \
            --notes "آخر نسخة. حمّل qiraati.apk وثبّته." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: qiraati-apk
          path: qiraati.apk
